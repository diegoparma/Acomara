# Preguntas de clientes etiquetadas con la entrada del FAQ que debería encontrar
# Nico (key de fuente/faq.yaml). Si encuentra cualquiera de las de `expect`
# entre las primeras k, cuenta como acierto.
#
#   python3 scripts/eval_retrieval.py                 # palabras clave (sin red)
#   python3 scripts/eval_retrieval.py --mode dense    # embeddings (OPENAI_API_KEY)
#   python3 scripts/eval_retrieval.py --mode all      # dense, keyword e híbrido
#
# `context` son los turnos previos, para seguimientos ("¿y cuánto sale?"): el
# servidor busca con el mensaje solo y con el contexto, y se queda con lo mejor.
# No copiar acá frases de also_asked: esto mide paráfrasis nuevas.

# --- precios ------------------------------------------------------------------
- {q: "Hola, ¿qué precio tiene subir el Aconcagua con ustedes?", lang: es, expect: [precio-expedicion]}
- {q: "cuanto cuesta la expedicion", lang: es, expect: [precio-expedicion]}
- {q: "¿El 12+2 es más barato que el 18+2?", lang: es, expect: [programas-cortos-mismo-precio, precio-expedicion, experiencia-y-programa-recomendado]}
- {q: "What's the cost per person?", lang: en, expect: [precio-expedicion]}
- {q: "Is the short program cheaper?", lang: en, expect: [programas-cortos-mismo-precio, precio-expedicion]}
- {q: "Qual o preço da expedição ao Aconcágua?", lang: pt, expect: [precio-expedicion]}
- {q: "Tem alguma promoção?", lang: pt, expect: [precio-expedicion]}
- {q: "¿Cuánto hay que dejar para reservar el lugar?", lang: es, expect: [reserva-y-formas-de-pago]}
- {q: "¿Se puede pagar con Binance?", lang: es, expect: [reserva-y-formas-de-pago]}
- {q: "Can I pay with a bank transfer?", lang: en, expect: [reserva-y-formas-de-pago]}
- {q: "Aceitam pagamento por PayPal?", lang: pt, expect: [reserva-y-formas-de-pago]}
- {q: "¿Cuánto sale una expedición privada?", lang: es, expect: [abierta-vs-privada]}
- {q: "How much is a private expedition just for my wife and me?", lang: en, expect: [abierta-vs-privada]}
- {q: "¿Cuánto cuesta el permiso del parque?", lang: es, expect: [permiso-precio-y-tramite]}
- {q: "How much is the park permit?", lang: en, expect: [permiso-precio-y-tramite]}
- {q: "Quanto custa a permissão do parque?", lang: pt, expect: [permiso-precio-y-tramite]}
- {q: "¿Cuánto se deja de propina a los guías?", lang: es, expect: [propinas]}
- {q: "How much should I tip?", lang: en, expect: [propinas]}

# --- seguimientos ---------------------------------------------------------------
- q: "¿Y cuánto sale?"
  lang: es
  context:
    - {role: user, text: "Nunca estuve en altura, ¿qué programa me conviene?"}
    - {role: assistant, text: "Para vos el indicado es el 18+2 Extendido, el que tiene más días de aclimatación."}
  expect: [precio-expedicion]
- q: "and how much is it?"
  lang: en
  context:
    - {role: user, text: "Which program do you recommend for a first 6000er?"}
    - {role: assistant, text: "The 18+2 Normal Route Extended, it has the most acclimatization days."}
  expect: [precio-expedicion]
- q: "E quanto custa?"
  lang: pt
  context:
    - {role: user, text: "Quero fazer o programa de 18+2 dias"}
    - {role: assistant, text: "Ótima escolha, é o que tem mais dias de aclimatação."}
  expect: [precio-expedicion]
- q: "¿Y está incluido?"
  lang: es
  context:
    - {role: user, text: "¿Hace falta el permiso del parque?"}
    - {role: assistant, text: "Sí, el Parque exige un permiso de ingreso para escalar."}
  expect: [permiso-precio-y-tramite, servicios-no-incluidos]
- q: "¿y cuándo salen?"
  lang: es
  context:
    - {role: user, text: "Me interesa el glaciar polaco"}
    - {role: assistant, text: "El 360° por el Glaciar Polaco es de 17+2 días, base en Plaza Argentina."}
  expect: [fechas-salida]
- q: "what about the dates?"
  lang: en
  context:
    - {role: user, text: "I'm interested in the 14+2"}
    - {role: assistant, text: "The Fast Ascent is only for climbers who have been above 6,000 m."}
  expect: [fechas-salida]
- q: "¿y cuántos son en el grupo?"
  lang: es
  context:
    - {role: user, text: "¿Los guías hablan inglés?"}
    - {role: assistant, text: "Sí, nuestros guías hablan inglés y están habilitados por el Parque."}
  expect: [tamano-de-grupo-y-guias]
- q: "¿Y si no llego a la cumbre me devuelven algo?"
  lang: es
  context:
    - {role: user, text: "¿Qué pasa si me siento mal en la montaña?"}
    - {role: assistant, text: "Los guías evalúan y, si hace falta, bajás acompañado."}
  expect: [abandono-de-la-expedicion, descenso-el-dia-de-cumbre]
- q: "y el seguro?"
  lang: es
  context:
    - {role: user, text: "¿El permiso está incluido?"}
    - {role: assistant, text: "No, el permiso del Parque se paga aparte; Acomara lo tramita sin cargo."}
  expect: [seguro-de-rescate]

