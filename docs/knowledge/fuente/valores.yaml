# VALORES — cada precio, porcentaje, fecha o link se escribe UNA sola vez acá.
#
# Los textos de datos-clave.yaml y faq.yaml los usan con {nombre}, por ejemplo
# "El precio es {precio_regular}". Al correr
#     python3 scripts/build_knowledge.py
# se regeneran datos-clave.md, faq_structured.md y faq_rag_chunks.jsonl con el
# valor nuevo en los tres idiomas (USD 7.250 en es/pt, USD 7,250 en en).
#
# Campos:
#   usd / percent / text   el valor (text puede ser uno solo o uno por idioma)
#   source        quién lo dijo y cuándo (Fernando por WhatsApp, web, FAQ...)
#   confidence    confirmed (lo confirmó Fernando) | web (FAQ/web, puede estar viejo) | pending (falta confirmar)
#   valid_from / valid_until   vigencia; pasado valid_until el build falla y avisa
#   check_with    repo hermano donde el mismo dato tiene que coincidir

season:
  text: "2026/27"
  source: Fernando (fechas de salida programadas)
  confidence: confirmed
  valid_from: 2026-07-01
  valid_until: 2027-03-31

season_months:
  text:
    es: noviembre a febrero
    en: November to February
    pt: novembro a fevereiro
  source: Fernando (oct 2026); la última salida (13 feb) termina a fines de febrero
  confidence: confirmed
  valid_from: 2026-07-01
  valid_until: 2027-03-31
  check_with: [aconcagua-plan-admin]

