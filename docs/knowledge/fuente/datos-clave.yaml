# DATOS CLAVE — van fijos en el prompt de Nico (docs/knowledge/datos-clave.md
# se genera desde acá: no editar el .md a mano).
#
# Valen más que cualquier fragmento del FAQ. Cada dato:
#   id          nombre corto y estable
#   text        el dato, en español, con {valores} de valores.yaml
#   source      de dónde sale: "Fernando" (lo que responde en las conversaciones,
#               lo más actual) y/o la entrada del FAQ (faq-005)
#   confidence  confirmed | web | pending (pending no se publica en el prompt)
#   valid_until opcional; vencido, el build falla
#   rule        true si es una instrucción para Nico y no un dato (se publica sin fuente)

title: DATOS CLAVE (siempre válidos, valen más que cualquier fragmento recuperado)
intro: >-
  Fuentes: lo que Fernando responde en las conversaciones (lo más actual) y, si él
  no lo dijo, las preguntas frecuentes (entre corchetes, la entrada). Si un
  fragmento recuperado dice otra cosa, vale esta ficha.

sections:
  - title: Programas (temporada {season}, salidas de {season_months})
    facts:
      - id: programa-18-2
        text: >-
          18+2 días, Ruta Normal, Extendido: el que recomendamos siempre, el de más días
          de aclimatación (caminatas a Plaza Francia, 4.200 m, y al cerro Bonete, 5.100 m).
          Para quien no estuvo por encima de 6.000 m, incluido quien hizo el Kilimanjaro,
          es el indicado.
        source: [Fernando, faq-005]
        confidence: confirmed
      - id: programas-cortos
        text: >-
          14+2 días, Ascenso Rápido, y 12+2 días, Ascenso Extremo (Ruta Normal): solo para
          quien ya estuvo por encima de 6.000 m, está muy entrenado y llega aclimatado.
          Saltean las caminatas de aclimatación. No los recomiendes a nadie sin esa experiencia.
        source: [Fernando, faq-005]
        confidence: confirmed
      - id: programa-polaco
        text: >-
          17+2 días, Glaciar Polaco 360° (travesía "Dos caras"): menos transitada y más
          exigente; más distancia, más frío, más viento. Base en Plaza Argentina.
        source: [faq-003]
        confidence: web
      - id: mismo-precio
        text: >-
          Todos los programas abiertos cuestan lo mismo, sin importar la duración: por eso
          conviene el 18+2.
        source: [Fernando]
        confidence: confirmed
      - id: requisitos
        text: >-
          No hace falta ser profesional, pero sí buena condición física, haber hecho trekking
          de varios días, caminado en altura y dormido en carpa. Lo más importante es la
          solvencia mental.
        source: [Fernando]
        confidence: confirmed

  - title: Precio y reserva
    facts:
      - id: precio
        text: >-
          Precio regular {price_regular} por persona. Algunas salidas tienen promoción, entre
          {price_promo_min} y {price_promo_max}, según los lugares libres de cada fecha. El
          precio exacto de una fecha lo confirma un asesor.
        source: [Fernando]
        confidence: confirmed
      - id: reserva
        text: Se reserva con un anticipo de {deposit} en {booking_url}.
        source: [Fernando]
        confidence: confirmed
      - id: formas-de-pago
        text: >-
          Formas de pago: PayPal ({paypal_fee} de comisión), transferencia bancaria
          ({bank_transfer_tax} de impuesto) o USDT por Coinbase o Binance (sin impuesto). Con
          tarjeta no se mantiene el precio promocional.
        source: [Fernando]
        confidence: confirmed
      - id: privadas
        text: >-
          Expediciones privadas: desde {price_private_from} por persona. En las abiertas no
          hay guía exclusivo.
        source: [Fernando]
        confidence: confirmed
      - id: treks
        text: >-
          Treks: Plaza de Mulas {trek_mulas_regular} (promo {trek_mulas_promo}). Plaza Francia
          solo privado, mínimo 2 personas, {trek_francia_private} por persona.
        source: [Fernando]
        confidence: confirmed

  - title: Qué incluye y qué no
    facts:
      - id: incluye
        text: >-
          Incluye: hotel en Mendoza (primera noche en habitación compartida), traslados
          Mendoza–Penitentes, alojamiento en Penitentes, todas las comidas en la montaña,
          mulas, servicios en los campamentos base, porteadores de equipo común en los
          campamentos de altura, guías, 2 días extra por mal tiempo, carpas, radio y botiquín
          con oxígeno.
        source: [Fernando]
        confidence: confirmed
      - id: no-incluye
        text: >-
          No incluye: vuelos, traslados al aeropuerto, comidas en Mendoza (salvo el desayuno
          del hotel), permiso del Parque, seguro de rescate, equipo personal, porteadores
          personales y comisiones de pago.
        source: [Fernando, faq-016]
        confidence: confirmed
      - id: regla-no-incluye
        text: >-
          Cuando digas qué no incluye, nombrá siempre los vuelos, el permiso, el seguro y el
          equipo personal.
        rule: true
      - id: regla-incluye-todo
        text: 'Nunca digas que "incluye todo": hay varias cosas que no incluye (la lista de arriba).'
        rule: true
      - id: permiso
        text: >-
          Permiso del Parque: NO está incluido. Acomara lo tramita sin cargo con anticipación;
          el valor depende de la nacionalidad, la ruta y la fecha (entre {permit_min} y
          {permit_max} según el FAQ).
        source: [faq-029, Fernando]
        confidence: confirmed
      - id: seguro
        text: >-
          Seguro de rescate: obligatorio por el Parque y no incluido; debe cubrir rescate hasta
          7.000 m y helicóptero, con 30 días de cobertura. Ronda los {insurance_approx} con
          Global Rescue.
        source: [faq-032, Fernando]
        confidence: confirmed
      - id: alquiler-equipo
        text: >-
          Equipo personal: se puede alquilar, ronda los {gear_rental_all} si hay que alquilar
          todo; después de reservar, Acomara ayuda con el alquiler.
        source: [Fernando]
        confidence: confirmed

  - title: Logística
    facts:
      - id: llegada
        text: Hay que llegar a Mendoza el día anterior al día 1 del programa.
        source: [Fernando]
        confidence: confirmed
      - id: sin-logistica-suelta
        text: >-
          Esta temporada no vendemos logística suelta ni reservamos vuelos. Fuera de temporada
          no hay servicios.
        source: [Fernando]
        confidence: confirmed

  - title: Lo que NO afirmes (todavía sin confirmar)
    facts:
      - id: no-afirmar-disponibilidad
        text: >-
          Disponibilidad o precio de una fecha puntual, y el plazo para pagar el saldo: decí que
          lo confirma un asesor.
        rule: true
      - id: no-afirmar-fechas
        text: >-
          Las fechas de salida son las programadas, no confirmadas: pueden haber cambiado.
          Cuando el cliente elija una fecha, aclará que la disponibilidad la confirma un asesor.
        rule: true

  - title: Cómo cerrar (criterio de Fernando)
    facts:
      - id: cierre
        text: >-
          No cierres con frases vacías tipo "te recomiendo el programa según tu experiencia".
          Cuando el cliente muestra interés concreto, invitalo a una videollamada corta (que te
          diga día, hora y desde qué ciudad) y pedile el email si todavía no lo dio.
        rule: true
