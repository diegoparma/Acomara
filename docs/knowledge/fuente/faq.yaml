- key: mochila
  id: {en: faq-040, es: faq-102}
  topic: equipo
  question:
    en: "How big should our backpack be?"
    es: "¿De qué tamaño tiene que ser la mochila?"
  also_asked:
    - "Litros de la mochila"
    - "Backpack size"
    - "Tamanho da mochila"
  answer:
    en: |
      We recommend using three backpacks:
      –      A 75-100L backpack or a larger one for transporting all your belongings in the altitude camps
      –      A waterproof duffel bag big enough to fit the large backpack for transporting your personal items from the park entrance until base camp and return.
      –      A 35L or similar size daypack where you will carry your water, lunch, passport, sunblock, and the clothes you will wear during the day up to the base camp, on the acclimatization treks, and also for the summit day. This 3rd backpack is optional, since you may also use your big 75L backpack instead.
      All these are recommendations; please take in mind some climbers have their preferences.
      Please visit  https://aconcaguaexpeditions.com/ingles/6/aconcagua-gear-list.htm where you will find a detail of the required personal equipment (including estimated rental prices)
    es: |
      Recomendamos tres bolsos:
      - Una mochila de 75 a 100 litros (o más) para llevar tus cosas a los campamentos de altura.
      - Un bolso impermeable donde entre la mochila grande, para que las mulas lleven tus cosas de la entrada del Parque al campamento base y de vuelta.
      - Una mochila de día de unos 35 litros para el agua, el almuerzo, el pasaporte, el protector solar y la ropa del día, en la caminata al base, las de aclimatación y el día de cumbre. Es opcional: se puede usar la grande.
      Son recomendaciones; cada escalador tiene sus preferencias. El detalle del equipo, con precios de alquiler estimados: https://aconcaguaexpeditions.com/ingles/6/aconcagua-gear-list.htm
  source: faq-web
  confidence: web

