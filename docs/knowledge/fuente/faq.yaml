- key: equipo-por-ruta
  id: {en: faq-036, es: faq-098}
  topic: equipo
  question:
    en: "Are differences in the gear for both routes?"
    es: "¿Hay diferencias de equipo entre las dos rutas?"
  also_asked:
    - "Equipo para el Polaco"
    - "Equipamento para a rota polonesa"
  answer:
    en: |
      There are almost no differences in personal gear between the Normal route expedition and the 360 Polish Traverse route. The only small difference in Aconcagua is that some climbers bring the ice axe for better fixation when walking on ice by the Polish route. All other personal equipment has no differences.
      The Polish Direct route that goes through the middle of the glacier requires ice climbing equipment to climb the Polish Glacier. This option is available only on a private Aconcagua climb.
    es: |
      Casi no hay diferencias de equipo personal entre la Ruta Normal y la travesía 360° por el Glaciar Polaco. La única es que algunos escaladores llevan piqueta en el Polaco para afirmarse mejor al caminar sobre hielo.
      La ruta Polaco Directo, que sube por el medio del glaciar, sí requiere equipo de escalada en hielo, y solo se hace como expedición privada.
  source: faq-web
  confidence: web

- key: alquiler-de-equipo
  id: {en: faq-037, es: faq-099}
  topic: equipo
  question:
    en: "Can we rent equipment in Mendoza?"
