    - "Gear rental"
    - "Aluguel de equipamento"
  answer:
    en: |
      Yes, however, availability and proper quality are not guaranteed. We strongly recommend renting in advance to guarantee availability and adequate quality. When renting in advance, your gear will be waiting for you at the time of the gear check, if any issue, a staff member of the rental store will solve it in less than 2 hours, no matter if it is Sunday or any other day.
      Renting all the personal gear costs around {gear_rental_all}. After booking, Acomara helps you with the rental.
      If you plan to rent in person in a local store in the City, it's important to come 1-2 days before Day 1 of your program, since on Day 1 you have to have all your personal gear with you at the time of the gear check with your guides.
    es: |
      Sí, aunque en el momento no se garantiza disponibilidad ni calidad. Recomendamos alquilar con anticipación: el equipo te espera en el control de equipo y, si hay algún problema, alguien de la casa de alquiler lo resuelve en menos de 2 horas, aunque sea domingo.
      Alquilar todo el equipo personal ronda los {gear_rental_all}. Después de reservar, Acomara te ayuda con el alquiler.
      Si vas a alquilar en persona en Mendoza, llegá 1 o 2 días antes del día 1: ese día tenés que tener todo tu equipo para el control con los guías.
